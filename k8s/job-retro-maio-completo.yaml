apiVersion: batch/v1
kind: Job
metadata:
  name: finops-retro-maio-completo
  namespace: finops
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
        app: finops-retro-maio-completo
    spec:
      serviceAccountName: finops-workload-identity-sa
      restartPolicy: Never
      containers:
        - name: finops-pipeline
          image: registrykmm.azurecr.io/finops-pipeline:latest
          imagePullPolicy: Always
          command: ["python", "sh/retro_fix.py", "--start", "2026-05-01", "--end", "2026-05-22"]
          envFrom:
            - configMapRef:
                name: finops-pipeline-config
          env:
            - name: PIPELINE_RUN_ID
              value: "retro-maio-completo"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "12Gi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
