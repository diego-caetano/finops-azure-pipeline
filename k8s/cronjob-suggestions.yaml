# CronJob semanal de sugestões de redução de custos (s09).
#
# Roda toda segunda-feira às 09:00 UTC, após:
#   07:00 UTC — finops-retro-fix (corrige últimos 7 dias com FOCUS atualizado)
#   09:00 UTC — finops-suggestions (analisa dados corrigidos e gera sugestões)
#
# Saída: gold/cost_suggestions/dt=yyyy-MM-dd/suggestions_{date}.csv
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: finops-suggestions
  namespace: finops
spec:
  schedule: "0 9 * * 1"
  timeZone: "UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 4
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            azure.workload.identity/use: "true"
            app: finops-suggestions
          annotations:
            logs_enabled: "true"
            logs_index: "kmm-finops-newkmm-prd"
        spec:
          serviceAccountName: finops-workload-identity-sa
          restartPolicy: Never
          containers:
            - name: finops-pipeline
              image: registrykmm.azurecr.io/finops-pipeline:latest
              imagePullPolicy: Always
              command: ["python", "jobs/run_suggestions.py"]
              envFrom:
                - configMapRef:
                    name: finops-pipeline-config
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "1000m"
                  memory: "4Gi"
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 1000
                capabilities:
                  drop: ["ALL"]
