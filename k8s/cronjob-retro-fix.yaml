# CronJob de reprocessamento semanal — FOCUS billing lag
#
# Roda toda segunda-feira às 07:00 UTC (após o pipeline principal das 06:00).
# Reprocessa os últimos 7 dias com FOCUS atualizado, cobrindo:
#   - Billing lag padrão de 2–3 dias
#   - Casos extremos: RI, Savings Plans, estornos, virada de mês
#
# Para retrocarga manual de intervalo específico:
#   kubectl create job --from=cronjob/finops-retro-fix finops-retro-fix-manual -n finops
#   # e sobrescrever command com: ["python", "sh/retro_fix.py", "--start", "YYYY-MM-DD", "--end", "YYYY-MM-DD"]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: finops-retro-fix
  namespace: finops
spec:
  schedule: "0 7 * * 1"
  timeZone: "UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 4
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            azure.workload.identity/use: "true"
            app: finops-retro-fix
          annotations:
            logs_enabled: "true"
            logs_index: "kmm-finops-newkmm-prd"
        spec:
          serviceAccountName: finops-workload-identity-sa
          restartPolicy: Never
          containers:
            - name: finops-pipeline
              image: registrykmm.azurecr.io/finops-pipeline:latest
              imagePullPolicy: Always
              command: ["python", "sh/retro_fix.py"]
              envFrom:
                - configMapRef:
                    name: finops-pipeline-config
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "1000m"
                  memory: "8Gi"
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 1000
                capabilities:
                  drop: ["ALL"]
