---
apiVersion: batch/v1
kind: Job
metadata:
  name: finops-diag-aks
  namespace: finops
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
        app: finops-diag-aks
    spec:
      serviceAccountName: finops-workload-identity-sa
      restartPolicy: Never
      containers:
        - name: finops-pipeline
          image: registrykmm.azurecr.io/finops-pipeline:latest
          imagePullPolicy: Always
          command: ["python", "sh/diag_aks_fanout.py"]
          env:
            - name: DIAG_DATE
              value: "2026-05-01"
          envFrom:
            - configMapRef:
                name: finops-pipeline-config
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "4Gi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
