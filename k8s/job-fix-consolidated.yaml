apiVersion: batch/v1
kind: Job
metadata:
  name: finops-fix-consolidated
  namespace: finops
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
        app: finops-fix-consolidated
    spec:
      serviceAccountName: finops-workload-identity-sa
      restartPolicy: Never
      containers:
        - name: finops-pipeline
          image: registrykmm.azurecr.io/finops-pipeline:latest
          imagePullPolicy: Always
          command: ["python", "sh/build_consolidated.py"]
          envFrom:
            - configMapRef:
                name: finops-pipeline-config
          env:
            - name: PIPELINE_RUN_ID
              value: "fix-totalcost-manifest"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "8Gi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
