# CronJob AKS — alocação via OpenCost
# Aplicar individualmente em cada cluster compartilhado (kubectl apply -f k8s/cronjob-aks.yaml)
#
# ATENÇÃO: o ServiceAccount (finops-workload-identity-sa) é gerenciado fora deste arquivo.
# Cada cluster tem seu próprio client-id — nunca incluir o ServiceAccount aqui para evitar
# sobrescrever a identity errada ao rodar kubectl apply -f k8s/ no cluster central.
# Setup inicial do SA em cada cluster (fazer uma vez):
#   kubectl annotate serviceaccount finops-workload-identity-sa -n finops \
#     azure.workload.identity/client-id=<CLIENT_ID_DO_CLUSTER> --overwrite
#
# Cluster                         | CLIENT_ID
# aks-hml-newkmm                  | 5eed8b89-7707-44cf-85e3-a6f86866a25f
# aks-prd-newkmm                  | 40995235-e00b-417e-83a6-4ca383f9d169
# aks-prd-br-newkmm               | e67c4ddc-1e3f-451b-a9bd-b41296bf2834
# aks-mg-kmm-firewall-eus-prd     | 23fe2b59-90a1-450d-8531-de76eba5340a
# aks-mg-kmm-firewall-eus-hml     | bffedfaa-5c53-4409-988c-c6884579cebc
#
# Mudar CLUSTER_NAME no ConfigMap para o nome do cluster onde o manifest é aplicado.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: finops-aks-config
  namespace: finops
data:
  FOCUS_STORAGE_ACCOUNT: "azurecostexportfocus10"
  FOCUS_CONTAINER: "mca"
  FOCUS_PREFIX: "KMM/MCA-KMM-focus-cost"
  PIPELINE_STORAGE_ACCOUNT: "stpslkmmfinopseusprd"
  PIPELINE_CONTAINER: "finops-v2"
  REFERENCE_PREFIX: "config/reference"
  AKS_OUT_PREFIX: "gold/aks_allocation_share_opencost"
  OPENCOST_ENDPOINT: "http://opencost.opencost.svc:9003"
  OPENCOST_TIMEOUT_SEC: "60"
  OPENCOST_RETRY_COUNT: "2"
  OPENCOST_RETRY_DELAY_SEC: "5"
  PIPELINE_DATE: ""
  LOG_LEVEL: "INFO"
  # Alterar para o nome do cluster onde este manifest é aplicado:
  CLUSTER_NAME: "aks-hml-newkmm"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: finops-aks-allocation
  namespace: finops
spec:
  schedule: "0 5 * * *"
  timeZone: "UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            azure.workload.identity/use: "true"
            app: finops-aks-allocation
          annotations:
            logs_enabled: "true"
            logs_index: "kmm-finops-newkmm-prd"
        spec:
          serviceAccountName: finops-workload-identity-sa
          restartPolicy: Never
          containers:
            - name: finops-aks
              image: registrykmm.azurecr.io/finops-pipeline:latest
              imagePullPolicy: Always
              command: ["python", "-m", "jobs.run_aks"]
              envFrom:
                - configMapRef:
                    name: finops-aks-config
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 1000
                capabilities:
                  drop: ["ALL"]
